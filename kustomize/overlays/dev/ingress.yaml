apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    #  annotations:
    #    cert-manager.io/cluster-issuer: letsencrypt-prod
    name: sk066-myfirst-ingress
    namespace: class-2
    labels:
        app: sk066-myfirst-ingress
spec:
    ingressClassName: nginx
    rules:
        - host: sk066-myfirst-ingress.class-2.skala-us.com
          http:
              paths:
                  - backend:
                        service:
                            name: sk066-myfirst-api-server
                            port:
                                number: 8080
                    path: /
                    pathType: Prefix
    tls:
        - hosts:
              - 'sk066-ingress.class-2.skala-us.com'
          secretName: wildcard-class-2-skala-us-com-tls
